function show(){const c=list[index];$('#visual').innerHTML=`<img src="${E(c.image)}" alt="${E(c.title)} 원본 화면">`;$('#details').innerHTML=`<p class="by">${E(c.topic)} · ${E(c.kind)}${c.award?' · '+E(c.award):''}</p><h2 id="caseTitle">${E(c.title)}</h2><p class="by">${E(c.by)}</p><div class="detail-actions"><button id="embed" class="btn primary">${c.kind==='게시물'?'원본 게시물 보기':'원본 영상 보기'} ▶</button><a class="btn" href="${E(c.url)}" target="_blank" rel="noopener">원본 열기 ↗</a><button id="still" class="btn">캡처 보기</button></div><p>${E(c.summary)}</p><p class="question">${E(c.speech)}</p><details><summary>제작 도구·출처·대본</summary><p>${E(c.model)}</p>${c.note?`<p>${E(c.note)}</p>`:''}<p class="small">PDF ${c.pdfPage}쪽 · 강의 ${c.slides.join(', ')}쪽</p><p><a href="${E(c.source)}" target="_blank" rel="noopener">${E(c.sourceTitle)} ↗</a></p><p><a href="lecture-notes.html#case-${c.id}" target="_blank" rel="noopener">전체 발표 대본 ↗</a></p></details><p class="small">Instagram 로그인이 필요하거나 재생이 제한되면 ‘원본 열기’를 이용하세요.</p>`;$('#details').scrollTop=0;$('#counter').textContent=(index+1)+' / '+list.length;$('#capture').textContent=c.capture;$('#prev').disabled=index===0;$('#next').disabled=index===list.length-1;$('#embed').onclick=()=>{$('#visual').innerHTML=`<iframe src="${E(c.embed)}" title="${E(c.title)} 원본" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`};$('#still').onclick=()=>{$('#visual').innerHTML=`<img src="${E(c.image)}" alt="${E(c.title)} 원본 캡처">`}}
function open(i){index=i;opener=document.activeElement;show();$('#viewer').showModal();$('#close').focus()}function close(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('#visual').replaceChildren();$('#details').replaceChildren();$('#viewer').close();opener?.focus()}function move(d){if(index+d<0||index+d>=list.length)return;index+=d;show()}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#close').onclick=close;$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#viewer').requestFullscreen().catch(()=>{});$('#viewer').addEventListener('cancel',e=>{e.preventDefault();close()});$('#viewer').onclick=e=>{if(e.target===$('#viewer'))close()};document.addEventListener('keydown',e=>{if(!$('#viewer').open)return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});$('#search').oninput=render;$('#topic').onchange=render;$('#domestic').onclick=()=>{domestic=!domestic;$('#domestic').setAttribute('aria-pressed',domestic);$('#domestic').classList.toggle('active',domestic);render()};$('#all').onclick=()=>{group='';domestic=false;$('#topic').value='';$('#search').value='';$('#domestic').setAttribute('aria-pressed','false');$('#domestic').classList.remove('active');render()};$('#start').onclick=()=>open(0);render();const id=params.get('case');if(id){const i=list.findIndex(c=>c.id===id);if(i>=0)open(i)}
</script></body></html>
