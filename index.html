<!-- 글꼴: G마켓 산스 (OFL) · 프리텐다드 (OFL) · 눈누(noonnu.cc)의 무료 한글 글꼴 -->

<body>
<!-- 쿼카 모션랩 모션 PPT 엔진 · 장 넘기기 → 스페이스 / 목록 L / 전체화면 F / 펜 P / 대본 N / 자료 O -->
<script>
function qmEngine(root, CFG, motion) {
  // 색 8개: 가장 밝은 색 → 가장 진한 색. [0] 흰 판·밝은 글자, [1]~[4] 연한 색에서 중간 색, [5] 포인트 색, [6] 둘째 포인트 색, [7] 글자색
  // 바꾸려면 CONFIG에 colors: ['#...', ...] 를 같은 순서로 넣으면 됩니다. 비워 두면 흰색·네이비 계열이 쓰입니다
  const COLORS = CFG.colors || ['#ffffff', '#e8ecf3', '#cfd7e6', '#9aa8c4', '#5c7099', '#1f3460', '#6e1a2f', '#15171c'];
  // 매번 같은 순서가 나오는 난수 (같은 seed면 같은 결과)
  const rand = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  // 샘플 그림: CONFIG.images가 비어 있을 때 쓰입니다. 어느 카드에 어떤 그림이 갈지는 열 때마다 섞입니다
  const dice = rand(CFG.seed || Math.floor(Math.random() * 1e9) + 1);
  const shift = Math.floor(dice() * 16);
  // 내 이미지: 칸마다 하나씩(빈 칸은 null → 그 칸은 샘플 그림). 칸보다 장면의 그림 자리가 많으면 돌아가며 씀
  const IMGS = (CFG.images || []).slice();
  const NIMG = IMGS.some(Boolean) ? IMGS.length : 0;
  const used = new Set(), usedArt = new Set();     // 장면이 몇 번째 그림까지 쓰는지 (사이트가 사진 칸 수를 정할 때 읽음)
  const FONT = '"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
  // 색의 밝기 (0 = 검정, 255 = 흰색). #rrggbb 꼴이 아니면 검정으로 봅니다
  // 투명 배경 위에 다른 배경을 깔 때(CONFIG.under = 그 배경의 대표 색)는 그 색을 바탕으로 보고 글자색을 고릅니다
  const light = color => color === 'transparent' && /^#[0-9a-f]{6}$/i.test(CFG.under || '') ? light(CFG.under) : /^#[0-9a-f]{6}$/i.test(color) ? (parseInt(color.slice(1, 3), 16) * 299 + parseInt(color.slice(3, 5), 16) * 587 + parseInt(color.slice(5, 7), 16) * 114) / 1000 : 0;
  const bright = light(CFG.bg);
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let frame = null, time = CFG.startAt || (still ? 4 : 0), last = 0, raf = 0, timer = 0, size = '';
  let playing = false, seen = true, want = CFG.autoplay !== false && !still, drew = false;
  // 랜딩페이지용: 실제 마우스·스크롤에 반응합니다 (CONFIG.live). true = 페이지에 붙여 쓸 때, 'try' = 미리보기 창(마우스가 없으면 연출대로)
  const LIVE = CFG.live === true || CFG.live === 'try', TRY = CFG.live === 'try';
  const live = { x: 0, y: 0, tx: 0, ty: 0, over: 0, on: false, down: 0, press: false, s: 0, ts: 0, ready: false };

  const api = {
    root: root,
    bg: CFG.bg,
    clear: CFG.bg === 'transparent',              // 투명 배경으로 그리는 중 (영상 편집기에 얹을 자막 등). 이때는 화면 전체를 칠하는 바탕을 그리지 않습니다
    fg: bright > 150 ? COLORS[7] : COLORS[0],     // 배경 위에 바로 쓰는 글자색
    ink: COLORS[7],                               // 흰 판 위에 쓰는 글자색
    colors: COLORS.slice(),                       // 색 8개 그대로 (배경 모션이 그라데이션 재료로 씀)
    accent: COLORS[5],                            // 포인트 색
    deep: COLORS[6],                              // 둘째 포인트 색
    on: color => light(color) > 150 ? COLORS[7] : '#ffffff',   // 그 색 위에 올릴 글자색 (밝은 색 위엔 진한 글자, 진한 색 위엔 흰 글자)
    tone: i => COLORS[1 + (i % 5 + 5) % 5],       // i번째 변주 색 (연한 색 ~ 포인트 색)
    rand: rand,
    font: FONT,
    ko: text => /[\u3131-\u318e\uac00-\ud7a3]/.test(text),   // 한글이 들어 있나 (한글이 든 글줄은 한글 글꼴 하나로 씁니다)
    count: NIMG,                                  // 넣은 이미지 칸 수 (0이면 샘플)
    words: CFG.words || [],                       // 넣은 낱말 (글자 모션에서 사용, 비면 기본 낱말)
    live: LIVE && !TRY,                           // 실제 페이지에서 마우스·스크롤에 반응하는 중 (미리보기 칸·영상 저장 때는 false)
    // 발표(모션 PPT)에서 '다음 효과'를 누른 단계 { step, at }: 발표기가 채워 줌. 없으면 null (미리보기·영상은 시간표대로)
    cue: CFG.cue || null,
    page: CFG.page || 0,                          // 모션 PPT에서 몇 번째 장인지 (발표기가 채워 줌, 없으면 0)
    // 마우스 자리 { x, y: 무대 안의 px, down: 누름 0~1, on: 마우스가 와 있는 정도 0~1, fake: 연출용 가짜 커서를 보일 정도 0~1 }
    // demo: 미리보기·영상 저장 때 쓸 연출 자리 { x, y, down, on } (t로 계산해서 넘김). 실제 페이지에서는 진짜 마우스를 따라갑니다
    pointer(demo) {
      const d = Object.assign({ x: api.W / 2, y: api.H / 2, down: 0, on: 1 }, demo || {});
      if (!LIVE) return { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 };
      if (!live.ready) return TRY ? { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 } : { x: d.x, y: d.y, down: 0, on: 0, fake: 0 };
      const k = TRY ? live.over : 1, mix = (a, b) => a + (b - a) * k;
      return { x: mix(d.x, live.x), y: mix(d.y, live.y), down: mix(d.down, live.down), on: TRY ? mix(d.on, live.over) : live.over, fake: 1 - k };
    },
    // 스크롤 진행 0~1. 미리보기·영상 저장 때는 demo(t로 계산한 값), 실제 페이지에서는 이 상자(또는 CONFIG.track의 칸)가 화면을 지나는 정도
    scroll: demo => LIVE && !TRY ? live.s : demo,
    image: i => { used.add(i); if (!NIMG) return null; const u = IMGS[i % NIMG]; if (u) return u; const a = api.art(i, true); return a ? a.url : null; },   // i번째 이미지 주소 (없으면 null, 빈 칸이면 샘플 그림)
    // i번째 샘플 그림 { cv, url }. 코드에 qmArt가 함께 들어 있을 때만 나옵니다 (plain: 글자 없는 그림만)
    art: (i, plain) => { drew = true; usedArt.add(i); return typeof qmArt === 'function' ? qmArt(plain ? i : i + shift, plain) : null; },
    // i번째 그림을 CSS background 값으로: 내 이미지가 있으면 이미지, 없으면 샘플 그림
    paint: i => {
      used.add(i);
      const u = NIMG ? IMGS[i % NIMG] : null, a = u ? null : api.art(i, NIMG > 0);   // 내 사진 사이의 빈 칸은 글자 없는 샘플 사진으로
      return u ? `url("${u}") center / cover no-repeat, #1c1c1e` : a ? `url(${a.url}) center / cover no-repeat` : `linear-gradient(145deg, ${COLORS[2]}, ${COLORS[5]})`;
    },
    // 숏폼 자막용 미리보기 바탕: 영상 대신 깔아 두는 흐릿한 장면 (내 이미지를 넣으면 그 그림). 투명 배경일 때는 그리지 않고 null을 돌려줍니다
    footage(dim) {
      if (api.clear) return null;
      used.add(0);
      const el = document.createElement('div'), n = IMGS[0] ? 1 : 0;
      el.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(' + (dim == null ? 0.85 : dim) + ');background:' + (n ? `url("${IMGS[0]}") center / cover no-repeat` :
        'radial-gradient(55% 32% at 28% 26%, rgba(243,237,226,.5), rgba(243,237,226,0) 70%), radial-gradient(45% 30% at 78% 52%, rgba(154,120,110,.45), rgba(154,120,110,0) 70%), ' +
        'radial-gradient(80% 45% at 50% 108%, rgba(31,52,96,.75), rgba(31,52,96,0) 72%), radial-gradient(40% 25% at 18% 70%, rgba(205,196,184,.28), rgba(205,196,184,0) 70%), linear-gradient(172deg, #4a4f5a, #23262d 60%, #15171c)') + ';';
      root.appendChild(el);
      return el;
    },
    // 0~1 사이 값을 부드럽게 (천천히 출발, 천천히 도착)
    ease: x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); },
    // 0~1 사이 값을 통통 튀게 (살짝 넘쳤다가 제자리로)
    spring: x => { x = Math.max(0, Math.min(1, x)) - 1; return 1 + 2.70158 * x * x * x + 1.70158 * x * x; },
    // 화면 한가운데가 (0,0,0)인 3D 공간. 숫자가 작을수록 원근감이 세집니다
    space(perspective) {
      root.style.perspective = perspective ? perspective + 'px' : 'none';
      return api.group(root, 'left:50%;top:50%;');
    },
    // 여러 조각을 한꺼번에 돌리거나 옮길 묶음
    group(parent, extra) {
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;' + (extra || '');
      parent.appendChild(el);
      return el;
    },
    // 빈 상자 하나. 상자의 중심이 (0,0)에 놓입니다 (UI 모션에서 사용)
    box(parent, w, h, css) {
      const el = document.createElement('div');
      el.style.cssText = `position:absolute;left:0;top:0;box-sizing:border-box;width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;font-family:${FONT};` + (css || '');
      parent.appendChild(el);
      return el;
    },
    // 카드 한 장. 카드의 중심이 (0,0)에 놓입니다 (카드 모션에서 사용)
    card(parent, i, w, h, twoSided) {
      const el = api.box(parent, w, h, 'overflow:hidden;'), s = el.style;
      s.borderRadius = Math.min(w, h) * (CFG.radius || 0) + 'px';
      s.backfaceVisibility = s.webkitBackfaceVisibility = twoSided ? 'visible' : 'hidden';
      s.background = api.paint(i);
      return el;
    }
  };

  function build() {
    const W = root.clientWidth, H = root.clientHeight;
    if (!W || !H || size === W + 'x' + H) return;
    size = W + 'x' + H;
    if (frame && frame.dispose) frame.dispose();   // WebGL 모션은 다시 만들기 전에 정리
    root.textContent = '';
    api.W = W; api.H = H; api.u = Math.min(W, H);
    if (LIVE && !TRY) { measure(); live.s = live.ts; }
    frame = motion(api);
    frame(time);
    runs(root);
    if (watch) watch.takeRecords();   // 방금 만든 장면은 위에서 다 봤으니 쌓인 기록은 버림
  }
  // 한 글줄 안에 한글과 영문·숫자가 섞였는데 영문 전용 글꼴(Anton·Inter 등)이 앞에 서 있으면,
  // 그 글줄은 글꼴 목록 뒤쪽의 한글 글꼴로 통째로 씁니다 (영문 글꼴과 한글 글꼴이 한 줄에서 따로 놀지 않게)
  const LATIN = /^(Anton|Archivo|Instrument Serif|Inter|JetBrains Mono)$/i;
  function runs(top) {
    const walk = document.createTreeWalker(top, NodeFilter.SHOW_TEXT), seen = new Set();
    for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.parentElement) seen.add(n.parentElement);
    seen.forEach(el => {
      let own = '';
      el.childNodes.forEach(c => { if (c.nodeType === 3) own += c.nodeValue; });
      if (!/[\u3131-\u318e\uac00-\ud7a3]/.test(own) || !/[A-Za-z0-9]/.test(own)) return;
      const list = getComputedStyle(el).fontFamily.split(',').map(f => f.trim().replace(/^["']|["']$/g, ''));
      if (!LATIN.test(list[0])) return;
      el.style.fontFamily = list.filter(f => !LATIN.test(f)).map(f => /^[a-z-]+$/.test(f) ? f : '"' + f + '"').join(',');
    });
  }
  // 장면이 글자를 바꾸면 바뀐 곳만 다시 봅니다
  const watch = window.MutationObserver ? new MutationObserver(list => mend(list)) : null;
  const mend = list => list.forEach(r => { const el = r.target.nodeType === 3 ? r.target.parentElement : r.target; if (el && root.contains(el)) runs(el); });
  if (watch) watch.observe(root, { childList: true, characterData: true, subtree: true });
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
    time += dt * CFG.speed;                       // 흐른 시간만큼 (뒤로 가지 않게)
    if (CFG.once && time > CFG.once) time = CFG.once;   // 한 번만: 화면에 들어오면 한 번 재생하고 이 초의 장면에서 멈춤
    last = now;
    if (LIVE) follow(dt);
    if (frame) frame(time);
  }
  // 스크롤 진행: CONFIG.track이 있으면 그 칸(키 큰 칸 안에 이 상자를 position:sticky로 넣은 경우)을 다 내려가는 정도, 없으면 이 상자가 화면 아래에서 위로 지나가는 정도
  function measure() {
    const el = CFG.track ? document.querySelector(CFG.track) : root;
    if (!el) return;
    const r = el.getBoundingClientRect(), vh = window.innerHeight || 1;
    live.ts = Math.max(0, Math.min(1, CFG.track ? -r.top / Math.max(1, r.height - vh) : (vh - r.top) / (vh + r.height)));
  }
  // 진짜 마우스·스크롤 값을 부드럽게 따라감
  function follow(dt) {
    const k = 1 - Math.exp(-dt * 14);
    live.x += (live.tx - live.x) * k;
    live.y += (live.ty - live.y) * k;
    live.over += ((live.on ? 1 : 0) - live.over) * (1 - Math.exp(-dt * 6));
    live.down += ((live.press ? 1 : 0) - live.down) * (1 - Math.exp(-dt * 18));
    if (!TRY) { measure(); live.s += (live.ts - live.s) * (1 - Math.exp(-dt * 10)); }
  }
  const spot = e => {
    const r = root.getBoundingClientRect();
    live.tx = (e.clientX - r.left) * root.clientWidth / (r.width || 1);
    live.ty = (e.clientY - r.top) * root.clientHeight / (r.height || 1);
    if (!live.ready) { live.x = live.tx; live.y = live.ty; live.ready = true; }
  };
  // 멈춰 있을 때(일시 정지·동작 줄이기 설정)도 마우스에는 바로 반응
  const poke = () => { if (playing || !frame) return; live.x = live.tx; live.y = live.ty; live.over = live.on ? 1 : 0; live.down = live.press ? 1 : 0; frame(time); };
  const hands = {
    pointerenter: e => { spot(e); live.on = true; poke(); },
    pointermove: e => { spot(e); live.on = true; poke(); },
    pointerleave: () => { live.on = false; live.press = false; poke(); },
    pointerdown: e => { spot(e); live.on = live.press = true; poke(); },
    pointerup: () => { live.press = false; poke(); }
  };
  if (LIVE) Object.keys(hands).forEach(k => root.addEventListener(k, hands[k]));

// 3) A·B 영상 비교: 두 화면을 나란히, 차례로 펼침. 마지막 단계에 한 줄 결론
SCENES.vcompare = P => (function slWbVCompare(api) {
  const ADDRESS = P.ADDRESS || '', PAGE = P.PAGE || '', APP = P.APP, NAV = P.NAV, NAV_ON = P.NAV_ON || 0, CURSOR = P.CURSOR || '';
  const KICKER = P.KICKER || '', TITLE = P.TITLE || '';
  const A = P.A || {}, B = P.B || {};   // { label, video, poster, lines: ['✕ ...'] }
  const BOTTOM = P.BOTTOM || '';
  const LOOP = P.LOOP || 12;
  const g = slWbKit(api), sk = g.sk, u = g.u, mp = g.mp, mw = g.mw, mh = g.mh;
  const w = g.win({ address: ADDRESS, page: PAGE, app: APP, nav: NAV, on: NAV_ON, cursor: CURSOR }), M = w.main;
  const head = g.head(M, KICKER, TITLE, { size: u * 0.06 });
  const y0 = head.bottom() + u * 0.03, gp = u * 0.03, aw = mw - mp * 2, cw = (aw - gp) / 2;
  const botH = BOTTOM ? u * 0.07 : 0, ah = mh - y0 - mp * 0.7 - botH;
  const vids = [];
  const cards = [A, B].map((o, i) => {
    const x = mp + i * (cw + gp), el = g.div(M, `position:absolute;left:${x}px;top:${y0}px;width:${cw}px;height:${ah}px;box-sizing:border-box;padding:${u * 0.016}px;display:flex;flex-direction:column;gap:${u * 0.012}px;opacity:0;` + g.card(0.4));
    const lab = g.div(el, `position:relative;display:flex;align-items:center;gap:${u * 0.012}px;`);
    const ch = g.div(lab, `flex:none;width:${u * 0.04}px;height:${u * 0.04}px;border-radius:${u * 0.01}px;background:${i ? g.ac : g.rgba(g.ink, 0.1)};display:flex;align-items:center;justify-content:center;`);
    g.text(ch, i ? 'B' : 'A', `position:relative;font:800 ${u * 0.022}px/1 ${g.body};color:${i ? g.acOn : g.ink};`);
    const nm = g.text(lab, o.label || '', `position:relative;font:750 ${u * 0.03}px/1.25 ${g.body};letter-spacing:-0.025em;white-space:nowrap;color:${g.ink};`);
    sk.fit(nm, cw - u * 0.09, 0.6);
    const vh = Math.min((cw - u * 0.032) * 9 / 16, ah * 0.6);
    const fr = g.div(el, `position:relative;flex:none;width:100%;height:${vh}px;border-radius:${u * 0.012}px;overflow:hidden;background:#0f1626;`);
    const v = qvVideo(fr, o.video, o.poster, api, o.fit ? 'object-fit:' + o.fit + ';' : ''); vids.push(v);
    const tx = g.div(el, `position:relative;display:flex;flex-direction:column;gap:${u * 0.006}px;min-height:0;overflow:hidden;`);
    (o.lines || []).slice(0, 3).forEach(s => g.text(tx, s, `position:relative;font:${i ? 600 : 500} ${u * 0.025}px/1.4 ${g.body};letter-spacing:-0.015em;color:${i ? g.ink : g.sub};`));
    g.shrink(tx, ah - vh - u * 0.1, 0.6);
    return { el: el, fr: fr, i: i };
  });
  cards.forEach(c => qvSound(g, c.fr, vids, c.i));
  let bot = null;
  if (BOTTOM) {
    bot = g.div(M, `position:absolute;left:${mp}px;top:${y0 + ah + u * 0.02}px;width:${aw}px;height:${botH - u * 0.016}px;box-sizing:border-box;display:flex;align-items:center;gap:${u * 0.014}px;padding:0 ${u * 0.024}px;border-radius:${u * 0.014}px;background:${g.tint};opacity:0;`);

    });

    w.leave(c.leave);
  }

  frame.fonts = true;
  return frame;
});

  note: '두 번째 습관은 새 주제를 찾기 전에, 잘했던 수업부터 꺼내는 거예요. (클릭) 내가 해 봤고 아이들이 좋아했던 수업이요. 저는 통일 열차 수업이었어요.\n\n(클릭) 그 수업을 한 문장으로 줄여요. 누가 뭘 궁금해하고, 뭘 알면 될까. (클릭) 그다음 활동지랑 PPT로 하던 걸 영상이나 모션으로 넓혀요. (클릭) 순서는 질문으로 열고, 살펴보고, 활동으로 닫아요.\n\n익숙한 좋은 수업에, AI로 가능해진 장면 하나를 더하는 거예요.' },
{ s: 'agenda', t: '좋은 AI 콘텐츠를 만드는 네 가지 질문', nav: 3, path: 'four-questions', time: '14:05–14:35',
  P: { KICKER: 'FOUR QUESTIONS', TITLE: '좋은 AI 콘텐츠, 네 가지 질문', LEAD: '생성 버튼 누르기 전에', NOW: 1, ITEMS: [['누구에게?', '학년 · 알고 있는 것 · 아이가 막히는 곳', 'Q1'], ['보고 나면 뭐가 달라질까?', '보고 나서 아이가 할 수 있는 것', 'Q2'], ['어떤 경험을 줄까?', '첫 질문 · 장면 · 형식 · 길이', 'Q3'], ['어떻게 확인할까?', '사실 · 눈높이 · AI 표시', 'Q4']] },
  note: '이제 네 가지 질문이에요. 생성 버튼 누르기 전에 이것만 정하면 돼요.\n\n(클릭) 누구에게 보여 줄까. (클릭) 보고 나면 뭐가 달라질까. (클릭) 어떤 경험을 줄까. (클릭) 그리고 어떻게 확인할까.\n\n하나씩, 제 통일 열차 수업을 예로 풀어 볼게요.' },
{ s: 'compare', t: 'Q1 · 누구에게?', nav: 3, path: 'q1', time: '14:35–15:20',
  P: { KICKER: 'Q1 · 누구에게?', TITLE: '누구에게 보여 줄까요?', LEFT: '흐릿한 대상', LEFT_ITEMS: ['“초등학생용으로”', '“아이들이 보기 좋게”', '“누구나 이해하게”'], RIGHT: '쌤티나는 대상', RIGHT_ITEMS: ['DMZ를 처음 만나는 4학년', '긴 글, 빠른 말이 버거운 아이', '어제 통일 열차 수업을 한 우리 반'] },
  note: '첫 번째, 누구에게? (클릭) AI한테 “초등학생용으로”, “아이들이 보기 좋게”라고만 하면, AI는 평균적인 초등학생을 떠올려요. 그래서 누구한테도 꼭 맞지 않는 영상이 나와요.\n\n(클릭) 쌤티나는 대상은 이렇게 구체적이에요. DMZ를 처음 만나는 4학년, 긴 글이랑 빠른 말이 버거운 아이, 어제 통일 열차 수업을 한 우리 반. 대상이 구체적이면 말투, 속도, 자막, 길이가 저절로 정해져요.' },
{ s: 'compare', t: 'Q2 · 보고 나면 뭐가 달라질까?', nav: 3, path: 'q2', time: '15:20–16:05',
  P: { KICKER: 'Q2 · 보고 나면?', TITLE: '보고 나면 뭐가 달라질까요?', LEFT: '주제만 있을 때', LEFT_ITEMS: ['“DMZ 알아보기”', '“기후변화 이해하기”', '“통일교육 영상”'], RIGHT: '보고 나서 아이가 할 수 있는 것', RIGHT_ITEMS: ['DMZ를 지킬 내 행동을 말해요', '날씨와 기후를 구별해요', '로봇 일, 사람 일을 갈라요'] },
  note: '두 번째, 보고 나면 뭐가 달라질까? (클릭) “DMZ 알아보기”, “기후변화 이해하기”는 주제예요. 아직 목표가 아니에요.\n\n(클릭) 그래서 보고 난 뒤에 아이가 뭘 할 수 있으면 좋을지로 써요. “DMZ를 지키려면 나는?”에 이유까지 답할 수 있으면 좋겠다. 날씨랑 기후가 어떻게 다른지 한 문장으로 말할 수 있으면 좋겠다. 이렇게 정해 두면 영상에 뭘 넣고 뺄지가 보여요. 성취기준을 아이 행동으로 바꾸는 거, 선생님들이 제일 잘하시잖아요 : )' },
{ s: 'flow', t: 'Q3 · 어떤 경험을 줄까?', nav: 3, path: 'q3', time: '16:05–16:50',
  P: { KICKER: 'Q3 · 어떤 경험?', TITLE: '어떤 경험을 줄까요?', ITEMS: [['첫 질문', '“DMZ에는\n누가 살고 있을까?”'], ['장면 세 개', '창밖 → 숲\n→ 두루미'], ['멈춤', '질문 뒤 3초,\n화면을 멈춰요'], ['아이가 할 일', '로봇한테 맡길 일\n하나와 그 이유']] },
  note: '세 번째, 어떤 경험을 줄까? 저는 영상 순서를 이렇게 정해요. (클릭) 설명 말고 질문으로 시작해요. “DMZ에는 누가 살고 있을까?”\n\n(클릭) 장면은 딱 세 개. 통일 열차 창밖, 숲, 날아오르는 두루미. (클릭) 질문 뒤에는 3초 멈춤을 넣어요. 이 멈춤이 있어야 영상이 수업이 돼요. (클릭) 끝은 아이가 할 일 하나로 닫아요.\n\n길이는 30초면 충분해요. 길게 만들수록 영상이 수업 시간을 가져가요.' },
{ s: 'points', t: 'Q4 · 어떻게 확인할까?', nav: 3, path: 'q4', time: '16:50–17:35',
  P: { KICKER: 'Q4 · 어떻게 확인?', TITLE: '어떻게 확인할까요?', ADD: '확인 더하기', ITEMS: [['사실 맞춰 보기', '숫자·장면·글자가\n자료랑 맞나요?'], ['눈높이 맞추기', '어려운 말, 빠른 말,\n작은 자막은 없나요?'], ['AI 표시', 'AI가 그린 장면이라고\n밝혔나요?']] },
  note: '네 번째, 어떻게 확인할까? 다 만들고 나서 선생님이 직접 보고 들으면서 확인하는 거예요. (클릭) 첫째, 사실 맞춰 보기. AI는 숫자랑 글자를 그럴듯하게 지어내요. 자료랑 꼭 맞춰 봐요.\n\n(클릭) 둘째, 눈높이 맞추기. 어려운 말, 너무 빠른 말, 작게 지나가는 자막이 없는지 들어 보고 봐요. (클릭) 셋째, AI 표시. DMZ 숲은 AI가 그린 장면이니까 그렇다고 밝혀요.\n\n이 확인은 AI가 못 해요. 우리 반을 아는 선생님만 할 수 있어요.' },

  P: { KICKER: 'CONTENT BRIEF · 예시', TITLE: '통일 열차 수업의 브리프', LEAD: '브리프 = 짧은 제작 설명서', NOW: 5, ITEMS: [['누구에게', 'DMZ를 처음 만나는 4학년', 'Q1'], ['보고 나면', '“DMZ를 지키려면 나는?”에 이유까지 답해요', 'Q2'], ['어떤 경험', '“DMZ에는 누가 살고 있을까?” · 30초 · 장면 세 개', 'Q3'], ['확인', '자료랑 맞춰 보기 · 쉬운 말 자막 · AI 표시', 'Q4'], ['AI에게 부탁', '장면별 화면·내레이션·자막·질문을 표로', 'AI']] },
  note: '네 가지 답을 모으면 이렇게 브리프 한 장이 돼요. 브리프는 AI한테 일을 맡기기 전에 건네는 짧은 제작 설명서예요.\n\n(클릭) 누구에게, (클릭) 보고 나면 뭐가 달라질지, (클릭) 어떤 경험을, (클릭) 어떻게 확인할지. (클릭) 그리고 마지막 줄에 AI한테 부탁할 걸 써요. “장면별로 화면, 내레이션, 자막, 질문을 표로 정리해 줘.”\n\n“통일교육 영상 재밌게 만들어 줘”랑 비교해 보세요. 기획은 선생님이 하고, AI는 그 조건에 맞춰 초안을 만들어요.',
  links: [['콘텐츠 브리프 빌더', 'brief/']] },
{ s: 'vcompare', t: 'LAB · 브리프 한 줄 차이', nav: 3, path: 'lab-1', time: '18:25–19:30',

<script>
// ===== 덱 조립 + 발표 도구 (대본 N · 자료 O · 진행 시계) =====
(function () {
  const BASE = { APP: 'AI 콘텐츠 특강', NAV: ['AI 콘텐츠 세계', '트렌드', '쌤티 기획', '실습', '왜 브루?'], CURSOR: '두목쿼카' };

  const total = String(DECK.length).padStart(2, '0');
  const SL = DECK.map((d, i) => {
    const P = Object.assign({}, BASE, { NAV_ON: d.nav || 0, ADDRESS: 'quoka.class/ai-content' + (d.path ? '/' + d.path : ''), PAGE: String(i + 1).padStart(2, '0') + ' / ' + total }, d.P || {});
    return { title: d.t, make: () => ({ fn: SCENES[d.s](P), cfg: Object.assign({}, CFG0, { images: d.img || [] }) }), bg: null };
  });
  const m = /^#s(\d+)$/.exec(location.hash || '');
  const start = m ? Math.max(0, Math.min(DECK.length - 1, +m[1] - 1)) : 0;
  qmDeckPlayer(document.body, { title: 'AI 콘텐츠 창작의 세계', ratio: '16 / 9', trans: 'zoom', slides: SL }, { start: start, pen: '#e8384f' });

  const box = document.querySelector('.qd'), bar = box.querySelector('.qd-bar');
  const LB = window.DECK_LINK_BASE || '', abs = u => /^https?:/.test(u) ? u : LB + u;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 대본
  const notes = document.createElement('div'); notes.className = 'qn'; notes.hidden = true; box.appendChild(notes);
  // 자료
  const links = document.createElement('div'); links.className = 'ql'; links.hidden = true; box.appendChild(links);
  // 진행 시계 (누르면 시작·멈춤, 두 번 빠르게 누르면 0으로)
  const mk = (txt, title) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.title = title; return b; };
  const bNote = mk('대본', '발표 대본 (N)'), bLink = mk('자료', '이 장의 자료 링크 (O)'), bTime = mk('00:00', '진행 시계: 눌러서 시작·멈춤, 두 번 눌러 초기화');
  bTime.className = 'qt';
  const penBtn = bar.querySelector('[data-a=pen]');
  bar.insertBefore(bTime, penBtn); bar.insertBefore(bNote, penBtn); bar.insertBefore(bLink, penBtn);
  let cur = start, t0 = 0, acc = 0, run = false;
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const secs = () => acc + (run ? (Date.now() - t0) / 1000 : 0);
  setInterval(() => { bTime.textContent = fmt(secs()); }, 500);
  bTime.addEventListener('click', () => { if (run) { acc = secs(); run = false; } else { t0 = Date.now(); run = true; } bTime.classList.toggle('run', run); });
  bTime.addEventListener('dblclick', () => { acc = 0; run = false; bTime.classList.remove('run'); bTime.textContent = '00:00'; });
  const GLOBAL = [['콘텐츠 51개 한 번에 보기', 'showcase.html'], ['발표 대본 전체 보기', 'lecture-notes.html'], ['리서치 노트 · 출처', 'research-notes.html'], ['쿼카 모션랩', 'https://gottkf1208.github.io/quoka-motion-lab/']];
  function paintNotes() {
    const d = DECK[cur];
    notes.innerHTML = `<header>${String(cur + 1).padStart(2, '0')} / ${total}<b>${esc(d.t)}</b><span>${esc(d.time || '')}</span></header>` +
      String(d.note || '').split('\n\n').map(p => `<p>${esc(p).replace(/\(클릭\)/g, '<span class="cue">(클릭)</span>')}</p>`).join('');
  }
  function paintLinks() {
    const d = DECK[cur], L = d.links || [];

      '<h4>강의 전체</h4>' + GLOBAL.map(x => `<a href="${esc(abs(x[1]))}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('');
  }
  const toggleNotes = () => { notes.hidden = !notes.hidden; if (!notes.hidden) { links.hidden = true; paintNotes(); } bNote.setAttribute('aria-pressed', !notes.hidden); };
  const toggleLinks = () => { links.hidden = !links.hidden; if (!links.hidden) { notes.hidden = true; bNote.setAttribute('aria-pressed', false); paintLinks(); } bLink.setAttribute('aria-pressed', !links.hidden); };
  bNote.addEventListener('click', toggleNotes); bLink.addEventListener('click', toggleLinks);
  // 실습 타이머 (장 데이터에 timer: [['5분 찾기', 300], ...] 가 있으면 화면 오른쪽 위에 뜸)
  const tm = document.createElement('div'); tm.className = 'qtm'; tm.hidden = true; box.appendChild(tm);
  let tLeft = 0, tRun = false, tLast = 0, tTot = 0;
  const tFmt = v => { v = Math.max(0, Math.ceil(v)); return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); };
  function paintTimer() {
    const d = DECK[cur], T = d.timer;
    tm.hidden = !T;
    if (!T) return;
    tm.innerHTML = `<b class="qtm-t">${tFmt(tTot ? tLeft : T[0][1])}</b><div class="qtm-b">${T.map((x, k) => `<button type="button" data-k="${k}">${esc(x[0])}</button>`).join('')}<button type="button" data-k="p">${tRun ? '멈춤' : '계속'}</button></div>`;
    tm.classList.toggle('done', tTot > 0 && tLeft <= 0);
  }
  tm.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    const T = DECK[cur].timer || [];
    if (b.dataset.k === 'p') { if (tTot) { tRun = !tRun; tLast = Date.now(); } }
    else { const x = T[+b.dataset.k]; tTot = tLeft = x[1]; tRun = true; tLast = Date.now(); }
    paintTimer();
  });
  setInterval(() => { if (tRun) { const n = Date.now(); tLeft -= (n - tLast) / 1000; tLast = n; if (tLeft <= 0) { tLeft = 0; tRun = false; } if (!tm.hidden) { const el = tm.querySelector('.qtm-t'); if (el) el.textContent = tFmt(tLeft); if (!tRun) paintTimer(); } } }, 250);
  document.addEventListener('qd:slide', e => {
    cur = e.detail; paintNotes(); paintLinks(); paintTimer();
    try { history.replaceState(null, '', '#s' + (cur + 1)); } catch (err) {}
    if (!run && cur > 0 && acc === 0) { t0 = Date.now(); run = true; bTime.classList.add('run'); }
  });
  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    if (e.key === 'n' || e.key === 'N') toggleNotes();
    else if (e.key === 'o' || e.key === 'O') toggleLinks();
  });
  paintNotes(); paintLinks(); paintTimer();
})();
