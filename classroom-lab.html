<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직접 눌러 보는 AI 수업 콘텐츠</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#162c40;font-family:'Malgun Gothic',sans-serif}main{max-width:1120px;margin:auto;padding:26px 35px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:38px;line-height:1.35;margin:12px 0 8px;letter-spacing:-1.4px}h2{font-size:27px;margin:0 0 14px}p{font-size:19px;line-height:1.6;margin:10px 0}.tag{font-size:13px;letter-spacing:1px;color:#31766e;font-weight:bold}.note{font-size:13px;color:#64778b}button,a.btn{font:700 17px 'Malgun Gothic',sans-serif;background:#e2eee9;color:#165c4c;border:1px solid #abcfc2;border-radius:12px;padding:13px 20px;cursor:pointer;text-decoration:none}button:hover{background:#c4e3d7}button:focus-visible{outline:4px solid #246dda;outline-offset:3px}.row{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;margin-top:22px}.panel{background:white;border-radius:22px;padding:28px;border:1px solid #d6e3ed}.stage{background:#dfeff3;min-height:350px;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden}.feedback{border-left:5px solid #26886d;background:#edf7f2;padding:18px;font-size:20px;margin-top:20px;min-height:80px}.big{font-size:68px;font-weight:900;line-height:1.2}.label{font-weight:700;color:#287a65}.bar{height:70px;display:flex;border:3px solid #1a6f5a;border-radius:10px;overflow:hidden;margin:12px 0 20px}.bar span{flex:1;border-right:2px solid #1a6f5a;background:#f4f8fb}.bar span:last-child{border:0}.bar .filled{background:#70ccaf}label{display:block;font-size:21px;margin:14px 0}input[type=range]{width:100%;accent-color:#257b62;min-height:35px}.choices{display:grid;gap:12px}.choices button{text-align:left;background:white;padding:19px}.badge{display:inline-block;background:#e4ebff;padding:5px 10px;border-radius:20px;font-size:14px}.art{width:100%;height:340px}.art text{font-family:'Malgun Gothic',sans-serif;font-size:21px;fill:#1b5060}.comic{display:grid;grid-template-columns:1fr 1fr;gap:16px}.comic button{min-height:165px;text-align:left;background:#fffdf5;border-color:#e6dabb}.comic .scene{display:block;font-size:47px;margin-bottom:12px}.talk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.talk-grid button{background:white;min-height:140px;font-size:21px}.talk-grid .symbol{display:block;font-size:40px;margin-bottom:12px}.source{border-top:1px solid #d7e2ec;margin-top:25px;padding-top:10px}.stepper{display:flex;gap:10px;flex-wrap:wrap}.stepper button[aria-pressed=true]{background:#176c58;color:white}.scene-big{font-size:110px}.train-route{display:flex;justify-content:space-between;align-items:center;background:#e5f1ec;border-radius:12px;padding:25px;font-size:24px;font-weight:bold}.train-route span{font-size:16px;color:#39745c}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){main{padding:20px}h1{font-size:29px}.layout{grid-template-columns:1fr}.talk-grid{grid-template-columns:1fr 1fr}.big{font-size:50px}.panel{padding:20px}.comic{grid-template-columns:1fr}.art{height:280px}header{align-items:start}.train-route{font-size:18px}}
</style></head><body><main><header><div class="tag">AI로 제작한 수업용 웹 콘텐츠 · 강의용 신규 제작</div><button id="reset" aria-label="활동 처음부터">처음부터 ↺</button></header><h1 id="title"></h1><p id="lead"></p><div id="app"></div><p class="note source">2026.10.21 강의용으로 AI의 코드 작성을 활용해 제작한 예시입니다. 실행 중 생성형 AI에 접속하지 않으며 학생 입력을 서버에 저장하지 않습니다. 교실 적용 전 학년·목표에 맞춰 교사가 검토하세요.</p></main><script>
const type=new URLSearchParams(location.search).get('type')||'fraction';const app=document.querySelector('#app');const title=document.querySelector('#title'),lead=document.querySelector('#lead');const titles={fraction:['분수는 숫자일까, 크기일까?','같은 크기의 전체를 나누고, 색칠한 부분을 비교해 보세요.'],water:['물방울의 여행을 따라가요','장면을 눌러 물의 상태와 이동을 설명해 보세요.'],train:['우리 반 통일 열차','가상의 평화 여행을 함께 기획하는 선택형 이야기'],comic:['말풍선 하나로 바뀌는 이야기','같은 장면에 어떤 말을 넣으면 서로를 이해할 수 있을까요?'],check:['그럴듯한 설명, 그대로 믿어도 될까?','교육 콘텐츠 편집자가 되어 틀린 설명과 확인할 근거를 찾아보세요.'],talk:['내 속도로 말할 수 있어요','필요한 표현을 골라 화면이나 목소리로 전해 보세요.']};let current=0;
function setup(){[title.textContent,lead.textContent]=titles[type]||titles.fraction;window.speechSynthesis?.cancel();if(type==='water')water();else if(type==='train')train();else if(type==='comic')comic();else if(type==='check')check();else if(type==='talk')talk();else fraction()}
function fraction(){app.innerHTML='<div class="layout"><section class="panel"><span class="badge">초등 수학 · 분수 크기</span><h2>같은 전체, 다른 나누기</h2><div id="bars"></div><div class="feedback" id="fractionResult" aria-live="polite"></div></section><section class="panel"><label for="den">분모 · 전체를 몇 등분할까요? <b id="denText">4</b></label><input id="den" type="range" min="2" max="12" value="4"><label for="num">분자 · 몇 조각을 칠할까요? <b id="numText">2</b></label><input id="num" type="range" min="0" max="4" value="2"><p>아래 막대는 항상 <b>1/2</b>입니다.</p><button id="half">2/4와 1/2 비교</button><p class="note">발문: 분모가 커지면 한 조각의 크기는 어떻게 될까요?</p></section></div>';const n=document.querySelector('#num'),d=document.querySelector('#den');function draw(){n.max=d.value;n.value=Math.min(+n.value,+d.value);let a=+n.value,b=+d.value;document.querySelector('#denText').textContent=b;document.querySelector('#numText').textContent=a;document.querySelector('#bars').innerHTML='<h3>'+a+'/'+b+'</h3><div class="bar" aria-label="'+b+'등분 중 '+a+'조각">'+Array.from({length:b},(_,i)=>'<span class="'+(i<a?'filled':'')+'"></span>').join('')+'</div><h3>1/2</h3><div class="bar"><span class="filled"></span><span></span></div>';document.querySelector('#fractionResult').textContent=a+'/'+b+'는 1/2'+(2*a===b?'와 크기가 같아요.':2*a>b?'보다 커요.':'보다 작아요.')}n.oninput=d.oninput=draw;document.querySelector('#half').onclick=()=>{d.value=4;n.value=2;draw()};draw()}
function water(){let steps=[['증발','액체 물이 기체인 수증기로 바뀌어 공기 중으로 이동합니다.','눈에 보이는 하얀 김과 기체인 수증기는 같을까요?'],['응결','수증기가 식어 작은 물방울이나 얼음 알갱이로 모이면 구름을 이룹니다.','차가운 컵 겉면의 물방울은 어디에서 왔을까요?'],['강수','구름 속 물방울이나 얼음 알갱이가 자라 비나 눈 등으로 내립니다.','비와 눈은 물의 상태가 어떻게 다를까요?'],['흐름·스며듦','물은 땅 위로 흐르거나 땅속으로 스며들고, 다시 강과 바다로 모입니다.','내린 비가 모두 바로 바다로 흘러갈까요?']];app.innerHTML='<div class="layout"><div class="stage"><svg class="art" viewBox="0 0 600 370" role="img" aria-label="바다, 구름, 산을 연결한 물의 순환 개념도"><rect width="600" height="370" fill="#dfeff3"/><circle cx="75" cy="65" r="38" fill="#ffcd59"/><path d="M290 300L420 115 565 300" fill="#72a898"/><path d="M385 164L420 115 457 165 426 152 406 169Z" fill="white"/><path d="M0 275Q100 250 210 280T600 290V370H0Z" fill="#579fcb"/><g fill="white"><ellipse cx="300" cy="80" rx="95" ry="35"/><circle cx="260" cy="60" r="35"/><circle cx="315" cy="53" r="46"/></g><g fill="none" stroke="#287794" stroke-width="8" stroke-linecap="round"><path id="evap" d="M100 240Q65 150 170 95"/><path id="rain" d="M330 135L310 190M360 140L340 195"/><path id="flow" d="M430 230Q380 300 250 312"/></g><text x="92" y="185">↑</text><text x="190" y="45">구름</text><text x="44" y="329" fill="white">바다</text><text x="455" y="266">육지</text></svg></div><div class="panel"><div class="stepper">'+steps.map((s,i)=>'<button data-step="'+i+'" aria-pressed="false">'+s[0]+'</button>').join('')+'</div><h2 id="stageTitle" style="margin-top:25px"></h2><p id="stageText"></p><div class="feedback" id="stageQ" aria-live="polite"></div><p class="note">개념을 단순화한 모형입니다. 실제 순환은 한 방향의 네 단계로만 진행되지 않습니다.</p></div></div>';function update(i){document.querySelectorAll('[data-step]').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));document.querySelector('#stageTitle').textContent=steps[i][0];document.querySelector('#stageText').textContent=steps[i][1];document.querySelector('#stageQ').textContent=steps[i][2]}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>update(+b.dataset.step));update(0)}
function train(){let scenes=[{q:'첫 정차역 · 어떤 여행을 만들까요?',choices:['서로의 일상을 알아보는 여행','자연과 생명을 살펴보는 여행'],reply:['장터와 학교생활에서 묻고 싶은 질문을 세 개 적어 보세요.','서식지를 방해하지 않고 관찰할 방법을 두 개 정해 보세요.']},{q:'생각 정거장 · 친구의 의견이 다르다면?',choices:['내 생각을 설명하고 친구의 이유도 듣기','다수결 전에 두 계획을 함께 살펴보기'],reply:['“나는 ___ 때문에 이렇게 생각해. 네가 중요하게 보는 것은 뭐야?”','각 계획에서 꼭 지키고 싶은 것을 하나씩 골라 새 계획을 만듭니다.']},{q:'도착역 · 여행 뒤 무엇을 남길까요?',choices:['평화를 위한 우리 반 약속','새롭게 궁금해진 질문 지도'],reply:['작은 일상에서 실천할 약속 하나와 그 이유를 나눕니다.','사실 확인이 필요한 질문을 골라 출처를 찾아봅니다.']}];current=0;function render(){let s=scenes[current];app.innerHTML='<div class="train-route">출발 <span>━━ 질문 ━━ 대화 ━━ 실천 ━━</span> 함께 도착</div><div class="layout"><div class="stage"><div style="text-align:center"><div class="scene-big">🚆</div><h2>상상으로 여는 평화 여행</h2><p>정거장 '+(current+1)+' / 3</p></div></div><div class="panel"><h2>'+s.q+'</h2><div class="choices">'+s.choices.map((x,i)=>'<button data-choice="'+i+'">'+x+'</button>').join('')+'</div><div class="feedback" id="trainReply" aria-live="polite">정답 경쟁 대신 선택의 이유를 이야기해요.</div><button id="nextStation" style="margin-top:15px">'+(current===2?'처음 정거장으로':'다음 정거장 →')+'</button></div></div><p class="note">허구의 수업용 시나리오입니다. 실제 운행 노선·여행 상품·현재의 DMZ 출입 가능 여부를 뜻하지 않습니다.</p>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>document.querySelector('#trainReply').textContent=s.reply[+b.dataset.choice]);document.querySelector('#nextStation').onclick=()=>{current=(current+1)%3;render()}}render()}
function comic(){let scenes=[['🌱','씨앗을 심었는데…','“아직 싹이 안 났어. 실패한 걸까?”'],['🪴','친구는 벌써 싹이 났어','“친구의 속도와 내 속도는 다를 수 있어.”'],['💧','조금 더 살펴보자','“물·빛·온도가 맞는지 같이 확인해 볼까?”'],['🌿','기다림도 배움이야','“어제와 달라진 것을 하나씩 기록하자.”']];app.innerHTML='<div class="layout"><section class="comic">'+scenes.map((s,i)=>'<button data-comic="'+i+'"><span class="scene">'+s[0]+'</span>'+(i+1)+'. '+s[1]+'</button>').join('')+'</section><section class="panel"><span class="badge">국어·창체 · 4컷 대화 콘텐츠</span><h2 style="margin-top:15px">누가 어떤 마음일까요?</h2><div class="feedback" id="speech" aria-live="polite">장면을 눌러 말풍선을 읽어 보세요.</div><label for="rewrite">내가 바꿔 쓸 한마디</label><textarea id="rewrite" rows="3" maxlength="140" style="width:100%;padding:15px;font:20px sans-serif;border:1px solid #9fb5c7;border-radius:12px" placeholder="친구에게 해 주고 싶은 말…"></textarea><button id="applySpeech" style="margin-top:12px">내 말풍선 보여 주기</button><p class="note">그림은 이모지로 구성한 강의용 웹 만화입니다. AI 이미지 생성 결과로 소개하지 않습니다.</p></section></div>';document.querySelectorAll('[data-comic]').forEach(b=>b.onclick=()=>document.querySelector('#speech').textContent=scenes[+b.dataset.comic][2]);document.querySelector('#applySpeech').onclick=()=>{let value=document.querySelector('#rewrite').value.trim();document.querySelector('#speech').textContent=value||'먼저 친구에게 전할 말을 적어 주세요.'}}
function check(){app.innerHTML='<div class="layout"><div class="panel"><span class="badge">일부러 오류를 넣은 설명 초안</span><h2 style="margin-top:20px">물의 순환 영상의 자막</h2><p style="font-size:28px;line-height:1.9">① 물이 증발하면 눈에 보이는 하얀 수증기가 됩니다.<br>② 구름은 작은 물방울이나 얼음 알갱이로 이루어집니다.<br>③ 물의 순환은 한 가지 정해진 길로만 움직입니다.</p></div><div class="panel"><h2>고쳐야 할 문장을 고르세요</h2><div class="choices">'+['①번만','①번과 ③번','모두 맞음'].map((x,i)=>'<button data-answer="'+i+'">'+x+'</button>').join('')+'</div><div id="checkReply" class="feedback" aria-live="polite">자신 있게 말하는 영상도 확인이 필요해요.</div><p class="note">확인할 근거: 교과서의 물의 상태·물의 순환 설명. 실제 AI가 낸 답변이 아니라 검수 연습을 위해 만든 초안입니다.</p></div></div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>document.querySelector('#checkReply').textContent=+b.dataset.answer===1?'맞아요. 기체인 수증기는 보이지 않고, 물은 여러 경로로 순환합니다. 사실을 고친 뒤 자막·음성도 함께 수정해야 해요.':'①과 ③을 다시 살펴보세요. 눈에 보이는 하얀 김과 수증기의 차이, 여러 이동 경로를 확인해요.')}
function talk(){const phrases=[['🙋','도와주세요'],['🐢','천천히 말해 주세요'],['🔁','다시 설명해 주세요'],['💭','생각할 시간이 필요해요'],['👀','그림으로 보여 주세요'],['✅','이해했어요']];app.innerHTML='<div class="talk-grid">'+phrases.map(([s,t],i)=>'<button data-talk="'+i+'"><span class="symbol" aria-hidden="true">'+s+'</span>'+t+'</button>').join('')+'</div><div class="panel" style="margin-top:20px"><p class="big" id="talkText" aria-live="polite" style="font-size:38px">내가 필요한 것을 전해요.</p><div class="row"><button id="speak">선택한 표현 읽어 주기 🔊</button><button id="stop">소리 멈추기</button></div><p class="note" id="voiceNote">화면으로 보여 주거나 기기의 한국어 읽기 기능을 사용할 수 있습니다. 실제 학습자와 함께 표현·크기·상징을 조정하세요.</p></div>';let phrase='';document.querySelectorAll('[data-talk]').forEach(b=>b.onclick=()=>{phrase=phrases[+b.dataset.talk][1];document.querySelector('#talkText').textContent=phrase});document.querySelector('#speak').onclick=()=>{if(!phrase){document.querySelector('#voiceNote').textContent='먼저 표현을 골라 주세요.';return}if(!('speechSynthesis'in window)){document.querySelector('#voiceNote').textContent='이 기기에서는 읽기가 지원되지 않습니다. 큰 글자로 보여 주세요.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(phrase);u.lang='ko-KR';u.rate=.85;u.onerror=()=>document.querySelector('#voiceNote').textContent='기기에서 음성을 재생하지 못했습니다. 큰 글자로 보여 주세요.';speechSynthesis.speak(u)};document.querySelector('#stop').onclick=()=>window.speechSynthesis?.cancel()}
document.querySelector('#reset').onclick=setup;setup();window.addEventListener('pagehide',()=>window.speechSynthesis?.cancel());
</script></body></html>
